framework:
    messenger:
        # Les messages dont le traitement échoue après tous les retries sont envoyés ici
        failure_transport: failed

        transports:
            # Transport asynchrone principal (table Doctrine messenger_messages)
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 2000
                    multiplier: 2
                    max_delay: 30000
            # File des messages définitivement en échec (rejouables manuellement)
            failed: 'doctrine://default?queue_name=failed'
            # Transport synchrone (exécution immédiate, utile pour les tests)
            sync: 'sync://'

        routing:
            # Envoi de l'email de reçu en arrière-plan
            'App\Message\SendPaymentReceiptMessage': async
            # Notifications client (email + WhatsApp). L'OTP, lui, reste synchrone :
            # un code de vérification différé par une file n'aurait pas de sens.
            'App\Message\SendWelcomeNotificationMessage': async
            'App\Message\SendSubscriptionNotificationMessage': async
            'App\Message\SendCoursePurchaseNotificationMessage': async
            'App\Message\SendSubscriptionExpiredMessage': async

when@dev:
    framework:
        messenger:
            routing:
                # En local, envoi immédiat sans worker Messenger (Mailpit sur :1025).
                'App\Message\SendPaymentReceiptMessage': sync
                'App\Message\SendWelcomeNotificationMessage': sync
                'App\Message\SendSubscriptionNotificationMessage': sync
                'App\Message\SendCoursePurchaseNotificationMessage': sync
                'App\Message\SendSubscriptionExpiredMessage': sync

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
