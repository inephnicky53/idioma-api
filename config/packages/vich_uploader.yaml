vich_uploader:
  db_driver: orm

  mappings:
    # Mapping pour les vidéos de cours
    course_videos:
      uri_prefix: /uploads/videos
      upload_destination: '%kernel.project_dir%/public/uploads/videos'
      namer: Vich\UploaderBundle\Naming\UniqidNamer
      delete_on_remove: true
      delete_on_update: true
      inject_on_load: true

    # Mapping pour les ebooks
    course_ebooks:
      uri_prefix: /uploads/ebooks
      upload_destination: '%kernel.project_dir%/public/uploads/ebooks'
      namer: Vich\UploaderBundle\Naming\UniqidNamer
      delete_on_remove: true
      delete_on_update: true
      inject_on_load: true

    # Mapping pour les images de cours
    course_images:
      uri_prefix: /uploads/courses
      upload_destination: '%kernel.project_dir%/public/uploads/courses'
      namer: Vich\UploaderBundle\Naming\UniqidNamer
      delete_on_remove: true
      delete_on_update: true
      inject_on_load: true

