controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

api_login_check:
    path: /api/login_check
    methods: ['POST']

# Refresh token endpoint
api_refresh_token:
    path: /api/token/refresh
    methods: ['POST']

# Course video upload endpoint
api_course_video_upload:
    path: /api/courses/{courseId}/videos/upload
    controller: App\Controller\Api\CourseVideoUploadAction
    methods: ['POST']
