# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    payment_provider: '%env(PAYMENT_PROVIDER)%'
    flexpay_endpoint: '%env(FLEXPAY_ENDPOINT)%'
    flexpay_card_endpoint: '%env(FLEXPAY_CARD_ENDPOINT)%'
    flexpay_merchant_name: '%env(FLEXPAY_MERCHANT_NAME)%'
    flexpay_token: '%env(FLEXPAY_TOKEN)%'
    merchant_name: '%env(MERCHANT_NAME)%'
    CLOUDINARY_URL: '%env(CLOUDINARY_URL)%'
    video_provider: '%env(VIDEO_PROVIDER)%'
    app_email_no_reply: '%env(APP_EMAIL_NO_REPLY)%'
    frontend_url: '%env(FRONTEND_URL)%'
    # WhatsApp Cloud API (Meta). Sans jeton ni identifiant de numéro, les envois
    # sont simplement tracés dans les logs : le reste de l'application continue.
    whatsapp_access_token: '%env(WHATSAPP_ACCESS_TOKEN)%'
    whatsapp_phone_number_id: '%env(WHATSAPP_PHONE_NUMBER_ID)%'
    whatsapp_api_version: '%env(WHATSAPP_API_VERSION)%'
    whatsapp_language: '%env(WHATSAPP_LANGUAGE)%'
    # Doivent correspondre exactement aux templates approuvés dans le
    # WhatsApp Business Manager.
    whatsapp_template_otp: '%env(WHATSAPP_TEMPLATE_OTP)%'
    whatsapp_template_welcome: '%env(WHATSAPP_TEMPLATE_WELCOME)%'
    whatsapp_template_subscription: '%env(WHATSAPP_TEMPLATE_SUBSCRIPTION)%'
    whatsapp_template_course_purchase: '%env(WHATSAPP_TEMPLATE_COURSE_PURCHASE)%'
    whatsapp_otp_has_copy_button: '%env(bool:WHATSAPP_OTP_HAS_COPY_BUTTON)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $videoProvider: '%video_provider%'
            $appEmailNoReply: '%app_email_no_reply%'
            $frontendUrl: '%frontend_url%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\Config:
        arguments:
            $flexpayToken: '%flexpay_token%'
            $flexpayEndpoint: '%flexpay_endpoint%'
            $merchantName: '%merchant_name%'

    App\Service\OperatorProcess:
        arguments:
            $provider: '%payment_provider%'

    App\Service\Payment\FlexPayProvider:
        arguments:
            $flexpayToken: '%flexpay_token%'
            $flexpayEndpoint: '%flexpay_endpoint%'
            $flexpayCardEndpoint: '%flexpay_card_endpoint%'
            $merchantName: '%flexpay_merchant_name%'
            $frontendUrl: '%frontend_url%'

    App\Service\Payment\PaymentManager:
        arguments:
            $provider: '%payment_provider%'
            $flexPayProvider: '@App\Service\Payment\FlexPayProvider'
            # Attente synchrone de la résolution du mobile money (secondes).
            # À garder sous le timeout du serveur web / proxy.
            $paymentWaitTimeout: '%env(int:PAYMENT_WAIT_TIMEOUT)%'
            $paymentPollInterval: '%env(int:PAYMENT_POLL_INTERVAL)%'

    App\EventListener\ConflictExceptionListener:
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.exception', priority: 100 }

    App\EventListener\AccessDeniedListener:
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.exception', priority: 50 }

    App\Service\CloudinaryService:
        arguments:
            $cloudinaryUrl: '%env(CLOUDINARY_URL)%'

    App\Service\VimeoService:
        arguments:
            $clientId: '%env(VIMEO_CLIENT_ID)%'
            $clientSecret: '%env(VIMEO_CLIENT_SECRET)%'
            $accessToken: '%env(VIMEO_ACCESS_TOKEN)%'

    App\EventListener\VideoUploadListener:
        tags:
            - { name: 'vich_uploader.event_listener', event: 'vich_uploader.post_upload', method: 'onVichUploaderPostUpload' }

    App\Contract\VideoStorageInterface:
        alias: App\Service\VideoStorageFactory

    App\Service\WhatsApp\CloudApiWhatsAppSender:
        arguments:
            $accessToken: '%whatsapp_access_token%'
            $phoneNumberId: '%whatsapp_phone_number_id%'
            $apiVersion: '%whatsapp_api_version%'
            $defaultLanguage: '%whatsapp_language%'

    # Point de bascule si l'on change de fournisseur WhatsApp (Twilio, BSP…) :
    # seule cette ligne est à modifier.
    App\Contract\WhatsAppSenderInterface:
        alias: App\Service\WhatsApp\CloudApiWhatsAppSender

    App\Service\WhatsAppService:
        arguments:
            $otpTemplate: '%whatsapp_template_otp%'
            $welcomeTemplate: '%whatsapp_template_welcome%'
            $subscriptionTemplate: '%whatsapp_template_subscription%'
            $coursePurchaseTemplate: '%whatsapp_template_course_purchase%'
            $otpTemplateHasCopyButton: '%whatsapp_otp_has_copy_button%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
