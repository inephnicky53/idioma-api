# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  app.name: '%env(APP_NAME)%'
  app.short_name: '%env(APP_SHORT_NAME)%'
  app.url: '%env(APP_URL)%'
  app.address: '%env(APP_ADDRESS)%'
  app.city: '%env(APP_CITY)%'
  app.teacher_label: '%env(APP_TEACHER_LABEL)%'
  app.logo_path: '%env(APP_LOGO_PATH)%'
  app.favicon_path: '%env(APP_FAVICON_PATH)%'
  app.primary_color: '%env(APP_PRIMARY_COLOR)%'
  app.secondary_color: '%env(APP_SECONDARY_COLOR)%'
  app.sms_from: '%env(APP_SHORT_NAME)%'
  app.api_url: '%env(APP_API_URL)%'
  app.features:
    livestreaming: '%env(bool:FEATURE_LIVESTREAMING)%'
    subscriptions: '%env(bool:FEATURE_SUBSCRIPTIONS)%'
    course_marketplace: '%env(bool:FEATURE_COURSE_MARKETPLACE)%'
    sms: '%env(bool:FEATURE_SMS)%'
  app.frontend_url: '%env(FRONTEND_URL)%'
  flexpay.token: '%env(FLEXPAY)%'
  flexpay.endpoint: '%env(FLEXPAY_ENDPOINT)%'
  flexpay.card_endpoint: '%env(FLEXPAY_CARD_ENDPOINT)%'
  flexpay.merchant_name: '%env(FLEXPAY_MERCHANT_NAME)%'
  paypal.client_id: '%env(PAYPAL_ID)%'
  paypal.client_secret: '%env(PAYPAL_KEY)%'
  paypal.mode: '%env(PAYPAL_MODE)%'

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    bind:
      $smsFrom: '%app.sms_from%'
      $appUrl: '%app.url%'
      $apiUrl: '%app.api_url%'
      $appShortName: '%app.short_name%'
      $appName: '%app.name%'
      $teacherLabel: '%app.teacher_label%'

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'


  kimia_api.event.jwt_created_listener:
    class: App\EventListener\JWTCreatedListener
    arguments: [ '@request_stack' ]
    tags:
      - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_created, method: onJWTCreated }

  kimia_api.event.jwt_authentication_success_listener:
    class: App\EventListener\JWTAuthenticationSuccessListener
    arguments: [ '@request_stack' ]
    tags:
      - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_success, method: onAuthenticationSuccess }

  App\Controller\Admin\DashboardController:
    arguments:
      $appName: '%app.short_name%'
      $logoPath: '%app.logo_path%'
      $faviconPath: '%app.favicon_path%'

  App\Controller\SecurityController:
    arguments:
      $appShortName: '%app.short_name%'
      $logoPath: '%app.logo_path%'
      $faviconPath: '%app.favicon_path%'

  App\Service\FeatureFlags:
    arguments:
      $features: '%app.features%'

  App\Service\Streaming\GetStreamService:
    arguments:
      $apiKey: '%env(default::GETSTREAM_API_KEY)%'
      $apiSecret: '%env(default::GETSTREAM_API_SECRET)%'

  App\State\Teacher\TeacherPricingProcessor:
    bind:
      $processor: '@api_platform.doctrine.orm.state.persist_processor'

  App\State\User\UserPasswordHasher:
    bind:
      $processor: '@api_platform.doctrine.orm.state.persist_processor'

  App\Service\Gateway\FlexPaieGateway:
    arguments:
      $flexPayToken: '%flexpay.token%'
      $flexPayEndpoint: '%flexpay.endpoint%'
      $merchantName: '%flexpay.merchant_name%'
    tags: [ 'app.payment_gateway' ]

  App\Service\Gateway\PaypalGateway:
    arguments:
      $clientId: '%paypal.client_id%'
      $clientSecret: '%paypal.client_secret%'
      $mode: '%paypal.mode%'
      $frontendUrl: '%app.frontend_url%'
    tags: [ 'app.payment_gateway' ]

  App\Service\Gateway\FlexPayCardGateway:
    arguments:
      $flexPayToken: '%flexpay.token%'
      $flexPayEndpoint: '%flexpay.endpoint%'
      $flexPayCardEndpoint: '%flexpay.card_endpoint%'
      $merchantName: '%flexpay.merchant_name%'
      $frontendUrl: '%app.frontend_url%'
    tags: [ 'app.payment_gateway' ]

  App\Service\OperatorProcess:
    arguments:
      $gateways: !tagged app.payment_gateway

  mjml_api:
    class: Mjml\Client
    arguments:
      - '%env(MJML_ID)%'
      - '%env(MJML_SECRET)%'

  App\Mjml\ApiRenderer:
    arguments:
      - '@mjml_api'