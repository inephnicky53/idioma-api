name: app

type: php:8.4

runtime:
    extensions:
        

#variables:
#    php:
#        # uncomment on PHP 7.4+
#        #opcache.preload: config/preload.php

build:
    flavor: none

disk: 1024

web:
    locations:
        "/":
            root: "public"
            expires: 1h
            passthru: "/index.php"

mounts:
    "/var/cache": { source: local, source_path: var/cache }


# Worker Messenger : traite les paiements (FlexPay) et les emails de reçu en arrière-plan.
# Redémarre périodiquement pour libérer la mémoire (bonne pratique pour les workers long-running).
workers:
    messenger:
        commands:
            start: |
                php bin/console messenger:consume async failed --time-limit=3600 --memory-limit=128M
        mounts:
            "/var/cache": { source: local, source_path: var/cache }

hooks:
    build: |
        set -x -e

        curl -fs https://get.symfony.com/cloud/configurator | bash
        # php-ext-install ctype X.Y.Z
        # php-ext-install iconv X.Y.Z
        
        NODE_VERSION=22 symfony-build

    deploy: |
        set -x -e

        symfony-deploy

crons:
    security-check:
        # Check that no security issues have been found for PHP packages deployed in production
        spec: '50 23 * * *'
        cmd: if [ "$PLATFORM_ENVIRONMENT_TYPE" = "production" ]; then croncape COMPOSER_ROOT_VERSION=1.0.0 COMPOSER_AUDIT_ABANDONED=ignore composer audit --no-cache; fi
    clean-expired-sessions:
        spec: '17,47 * * * *'
        cmd: croncape php-session-clean
    process-expired-subscriptions:
        spec: '0 8 * * *'
        cmd: croncape php bin/console app:subscriptions:process-expired
    check-pending-payments:
        # Filet de sécurité : résout les paiements mobile money dont l'attente
        # synchrone (~45 s) a expiré côté requête HTTP et dont le callback
        # FlexPay ne serait jamais arrivé (onglet fermé, panne réseau...).
        spec: '*/5 * * * *'
        cmd: croncape php bin/console app:payments:check-pending


